    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.34,<1",
]
