spring.application.name=spring-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rto_tracker?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.swagger.allowed-origin=${SWAGGER_ORIGIN:http://localhost:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.general-requests=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
app.rate-limit.general-window-millis=${RATE_LIMIT_WINDOW_MILLIS:60000}
app.rate-limit.login-ip-requests=${LOGIN_RATE_LIMIT_IP_REQUESTS:50}
app.rate-limit.login-window-millis=${LOGIN_RATE_LIMIT_WINDOW_MILLIS:900000}
app.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:100000}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
app.jwt.issuer=${JWT_ISSUER:rto-tracker-local}
app.jwt.audience=${JWT_AUDIENCE:rto-assistant-services}
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:.secrets/jwt-private.pem}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:.secrets/jwt-public.pem}
app.jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
app.jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
